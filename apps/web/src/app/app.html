<a class="skip-link" href="#main-content">Vai al contenuto</a>

<div class="app-shell">
  <header class="topbar">
    <a class="brand" routerLink="/" aria-label="Coppa Telenia, nuova partita">
      <span class="brand-mark" aria-hidden="true">
        <span></span><span></span><span></span>
      </span>
      <strong>Coppa Telenia</strong>
    </a>

    @if (auth.session()) {
    <button class="account-pill" type="button" (click)="signOut()">
      <span class="status-dot company"></span>
      <span>Connesso</span>
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <path d="M9 6H5v12h4M16 16l4-4-4-4M20 12H9" />
      </svg>
    </button>
    } @else {
    <a class="account-pill" routerLink="/accedi">
      <span class="status-dot"></span>
      Accedi
    </a>
    }
  </header>

  @if (!auth.configured()) {
  <aside class="config-alert" role="status">
    Configurazione server mancante.
  </aside>
  }

  <main id="main-content">
    <router-outlet></router-outlet>
  </main>

  <footer class="app-footer">
    <a
      routerLink="/changelog"
      [attr.aria-label]="'Apri il changelog della versione ' + appVersion"
    >
      v{{ appVersion }}
    </a>
  </footer>

  <nav class="bottom-nav" aria-label="Navigazione principale">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8" />
        <path
          d="m8.5 9 3.5-2.5L15.5 9l-1.3 4.1h-4.4L8.5 9Zm1.3 4.1-2.7 2M14.2 13.1l2.7 2"
        />
      </svg>
      <span>Gioca</span>
    </a>
    <a routerLink="/classifica" routerLinkActive="active">
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <path d="M5 19V9M12 19V5M19 19v-7" />
      </svg>
      <span>Classifica</span>
    </a>
    <a routerLink="/statistiche" routerLinkActive="active">
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <path d="M4 19 9 12l4 3 7-9M4 20h16" />
      </svg>
      <span>Statistiche e premi</span>
    </a>
    <a routerLink="/storico" routerLinkActive="active">
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <path d="M4 7h16v13H4zM8 4v6M16 4v6M4 11h16" />
      </svg>
      <span>Storico</span>
    </a>
    @if (auth.companyUser()) {
    <a routerLink="/giocatori" routerLinkActive="active">
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <circle cx="9" cy="8" r="3" />
        <path d="M3.5 19c.4-4 2.1-6 5.5-6s5.1 2 5.5 6M18 8v6M15 11h6" />
      </svg>
      <span>Giocatori</span>
    </a>
    }
  </nav>

  @if (store.notice(); as notice) {
  <button
    class="toast"
    type="button"
    (click)="store.dismissNotice()"
    aria-label="Chiudi notifica"
  >
    <span class="toast-check" aria-hidden="true">✓</span>
    {{ notice }}
  </button>
  }
</div>
